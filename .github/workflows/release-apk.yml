name: Build and Release Spotify APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/Spotify-v1.0.${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Spotify v1.0.${{ github.run_number }}
          body: |
            Aggiornamento automatico generato dal commit `${{ github.sha }}`.
            Messaggio: ${{ github.event.head_commit.message }}
          files: release-output/Spotify-v1.0.${{ github.run_number }}.apk
